name: Publicar no Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: novogerenciadordeatividades
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: 0.5.5
      - name: Validar credencial
        run: test -n "$FLY_API_TOKEN"
      - name: Autenticar no registro do Fly
        run: flyctl auth docker
      - name: Gerar e enviar imagem pelo Docker do GitHub
        run: |
          IMAGE="registry.fly.io/${FLY_APP}:git-${GITHUB_SHA}"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
      - name: Publicar imagem pronta
        run: flyctl deploy --app "$FLY_APP" --image "registry.fly.io/${FLY_APP}:git-${GITHUB_SHA}" --yes --wait-timeout 5m
      - name: Conferir estado da aplicacao
        run: flyctl status --app "$FLY_APP"
