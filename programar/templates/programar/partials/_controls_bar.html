{# antes a barra estava "solta"; agora ela fica dentro de um card com botoes no rodape #}
<div class="container">
  <div class="card shadow-sm my-3 programar-controls">
    <div class="card-body">
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <label id="programar-range-label" for="programar-select-semana" class="mb-0 small text-muted">Semana:</label>
        <select id="programar-select-semana" class="form-select form-select-sm" style="min-width: 220px;">
          <option value="">Selecione a semana</option>
        </select>
        <script>
          (function(){
            function normalizarObservacaoPadrao(){
            const ta = document.getElementById("programar-observacao");
            if (!ta) return false;
            const compacta = [
              "AVISO DE CONFIDENCIALIDADE",
              "",
              "A Programacao Mensal de Atividades e documento interno da ULSAV, destinado ao planejamento, coordenacao e execucao das acoes institucionais.",
              "",
              "As informacoes sao restritas aos servidores da Unidade e nao devem ser compartilhadas, reproduzidas ou divulgadas a terceiros sem autorizacao da chefia imediata. A divulgacao indevida podera comprometer as acoes de fiscalizacao e sujeitar o responsavel as medidas administrativas cabiveis."
            ].join("\n");
            const atual = String(ta.value || "");
            const isDefaultAntigo = atual.includes("AVISO DE CONFIDENCIALIDADE")
              && atual.includes("Solicitamos a colabora")
              && atual.includes("bom desempenho das atividades institucionais");
            if (isDefaultAntigo) ta.value = compacta;
            return true;
            }
            if (!normalizarObservacaoPadrao()) {
              document.addEventListener("DOMContentLoaded", normalizarObservacaoPadrao, { once: true });
            }
          })();
        </script>
      </div>

      <div class="mt-3">
        <label for="programar-observacao" class="form-label small text-muted mb-1">Observação (opcional)</label>
        <textarea
          id="programar-observacao"
          class="form-control form-control-sm"
          rows="4"
          maxlength="2000"
          placeholder="Escreva aqui uma explicação/observação para ser impressa no final do relatório (se desejar)."
        >AVISO DE CONFIDENCIALIDADE

A Programação Mensal de Atividades constitui documento de uso interno desta ULSAV, elaborado para fins de planejamento, coordenação e execução das ações institucionais.

As informações nela contidas são de caráter restrito e destinam-se exclusivamente aos servidores da Unidade, não devendo ser compartilhadas, reproduzidas ou divulgadas a terceiros, por qualquer meio, sem autorização da chefia imediata.

A divulgação indevida de informações constantes na programação poderá comprometer a eficácia das ações de fiscalização, bem como sujeitar o responsável às medidas administrativas cabíveis.

Solicitamos a colaboração de todos os servidores na preservação da confidencialidade deste documento, zelando pela segurança das informações e pelo bom desempenho das atividades institucionais.</textarea>
      </div>
    </div>
    <div class="card-footer bg-transparent d-flex justify-content-end">
      <div class="btn-group text-nowrap">
        <button id="programar-btnImprimirMes" class="btn btn-outline-secondary btn-sm">Gerar programação de atividades mensais</button>
        <button id="programar-btnImprimirProgramacao" class="btn btn-outline-primary btn-sm">Gerar programação de atividades semanal</button>
        <button id="programar-btnMapaMes" class="btn btn-outline-secondary btn-sm">Gerar mapa de atividades mensal</button>
        <button id="programar-btnImprimirMapa" class="btn btn-outline-secondary btn-sm">Gerar mapa de atividades semanal</button>
        <button id="programar-btnImprimirJustificativas" class="btn btn-outline-dark btn-sm">Gerar justificativas</button>
      </div>
    </div>
  </div>
  
</div>
