<script>
(function () {
  const NS = (window.PROGRAMAR = window.PROGRAMAR || {});
  const el = (id) => document.getElementById(id);
  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (ch) => (
      {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]
    ));
  }

  // ---------- estado compartilhado / fallbacks ----------
  const allocations = (NS._allocations = NS._allocations || Object.create(null));
  const DRAG = (NS._dragState = NS._dragState || { id: null });
  const TEAM_DRAG_KEY = "application/x-programar-team-card";

  function findServerNameById(sid) {
    const div = document.querySelector(`.servidor-card[data-id="${sid}"]`);
    const name = div?.querySelector(".srv-name")?.textContent || div?.textContent || sid;
    return String(name).trim();
  }
  function appendToAvailableIfMissing(sid, name) {
    const list = el("servidoresLivres");
    if (!list) return;
    if (!list.querySelector(`.servidor-card[data-id="${sid}"]`)) {
      const d = document.createElement("div");
      d.className = "servidor-card";
      d.dataset.id = sid;
      d.setAttribute("draggable", "true");
      d.innerHTML = `
        <span class="srv-icon"><i class="bi bi-person-fill"></i></span>
        <span class="srv-name">${escapeHtml(name)}</span>
      `;
      list.appendChild(d);
    }
  }
  function ensureTeamDragId(card) {
    if (!card) return "";
    if (!card.dataset.teamDragId) {
      card.dataset.teamDragId = `team-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }
    return card.dataset.teamDragId;
  }
  function getServerIdsFromCard(card) {
    if (!card) return [];
    const seen = new Set();
    const ids = [];
    card.querySelectorAll(".meta-dropzone .servidor-chip[data-id], .meta-dropzone .servidor-card[data-id]").forEach((node) => {
      const sid = String(node.dataset.id || node.dataset.servidorId || "").trim();
      if (!sid || seen.has(sid)) return;
      seen.add(sid);
      ids.push(sid);
    });
    return ids;
  }
  function ensureExpedienteManualBadge(card) {
    if (!card) return;
    card.dataset.expedienteManual = "1";
    card.classList.add("expediente-manual");
    let badge = card.querySelector(".srv-count-badge");
    if (!badge) {
      badge = document.createElement("span");
      badge.className = "srv-count-badge";
      card.appendChild(badge);
    }
    card.classList.add("has-count");
    badge.textContent = "";
    badge.title = "Readicionado manualmente ao expediente";
  }
  function clearExpedienteManualBadge(card) {
    if (!card) return;
    delete card.dataset.expedienteManual;
    card.classList.remove("expediente-manual", "has-count");
    const badge = card.querySelector(".srv-count-badge");
    if (badge) {
      badge.textContent = "";
      badge.title = "";
    }
  }
  function isActivelyAllocated(sid) {
    const container = el("metaCardsContainer");
    if (!container || !sid) return false;
    return Array.from(container.querySelectorAll("[data-meta-id]")).some((card) => {
      const statusExecucao = String(card.dataset.statusExecucao || "").trim().toLowerCase();
      if (statusExecucao === "cancelada" || statusExecucao === "cancelado") return false;
      return !!card.querySelector(`.meta-dropzone [data-id="${sid}"], .meta-dropzone [data-servidor-id="${sid}"]`);
    });
  }
  function syncExpedienteManualBadge(card, sid) {
    if (isActivelyAllocated(sid)) ensureExpedienteManualBadge(card);
    else clearExpedienteManualBadge(card);
  }
  function appendToExpedienteIfMissing(sid, name) {
    const list = el("expedienteAdmin");
    if (!list) return;
    const existing = list.querySelector(`.servidor-card[data-id="${sid}"]`);
    if (!existing) {
      const d = document.createElement("div");
      d.className = "servidor-card";
      d.dataset.id = sid;
      d.setAttribute("draggable", "true");
      d.innerHTML = `
        <span class="srv-icon"><i class="bi bi-person-fill"></i></span>
        <span class="srv-name">${escapeHtml(name)}</span>
        <span class="srv-count-badge"></span>
      `;
      list.appendChild(d);
      syncExpedienteManualBadge(d, sid);
    } else {
      syncExpedienteManualBadge(existing, sid);
    }
  }
  function removeFromExpediente(sid) {
    el("expedienteAdmin")?.querySelector(`.servidor-card[data-id="${sid}"]`)?.remove();
  }
  function rebuildAllocationsFromCards() {
    Object.keys(allocations).forEach((key) => { delete allocations[key]; });
    const container = el("metaCardsContainer");
    if (!container) return allocations;
    container.querySelectorAll(".meta-dropzone .servidor-chip, .meta-dropzone .servidor-card").forEach((node) => {
      const metaCard = node.closest("[data-status-execucao]");
      const statusExecucao = String(metaCard?.dataset?.statusExecucao || "").trim().toLowerCase();
      if (statusExecucao === "cancelada" || statusExecucao === "cancelado") return;
      const sid = String(node.dataset.id || node.dataset.servidorId || "").trim();
      if (!sid) return;
      allocations[sid] = (allocations[sid] || 0) + 1;
    });
    return allocations;
  }
  function updateCounts() {
    rebuildAllocationsFromCards();
    const livres = el("servidoresLivres");
    const cLivres = el("countServidoresLivres");
    const cExp = el("countExpedienteAdmin");
    if (cLivres && livres) cLivres.textContent = String(livres.querySelectorAll(".servidor-card").length);
    if (cExp && el("expedienteAdmin")) {
      const ids = new Set(Array.from(el("expedienteAdmin").querySelectorAll(".servidor-card[data-id]")).map((card) => String(card.dataset.id)));
      cExp.textContent = String(ids.size);
    }

    // badges na pool
    if (livres) {
      livres.querySelectorAll('.servidor-card[data-id]').forEach((div) => {
        const sid = div.dataset.id;
        const n = allocations[sid] || 0;
        let b = div.querySelector(".srv-count-badge");
        if (!b) {
          b = document.createElement("span");
          b.className = "srv-count-badge";
          div.appendChild(b);
        }
        if (n > 0) { div.classList.add("has-count"); b.textContent = n; }
        else { div.classList.remove("has-count"); b.textContent = ""; }
      });
    }

    // contagem dentro de cada card de meta
    const cont = el("metaCardsContainer");
    if (cont) {
      cont.querySelectorAll("[data-meta-id]").forEach((card) => {
        const n = card.querySelectorAll(".servidor-chip").length;
        const badge = card.querySelector(".count-meta");
        if (badge) badge.textContent = String(n);
      });
    }
  }
  NS.updateCounts = NS.updateCounts || updateCounts;
  NS.rebuildAllocationCounts = NS.rebuildAllocationCounts || rebuildAllocationsFromCards;

  // ---------- injeta/garante a dropzone ----------
  function ensureDropzone(card) {
    if (!card) return null;
    if (card.id === "expedienteAdmin" || card.closest?.("#expedienteAdminCard")) return null;
    let dz = card.querySelector(".meta-dropzone");
    if (!dz) {
      const body = card.querySelector(".meta-body, .card-body") || card;
      dz = document.createElement("div");
      dz.className = "servidores-grid meta-dropzone dropzone mb-3";
      body.prepend(dz); // insere no topo
    }
    return dz;
  }

  function upgradeExistingCards() {
    const container = el("metaCardsContainer");
    if (!container) return;
    container.querySelectorAll("[data-meta-id]").forEach((card) => {
      ensureDropzone(card);
      card.setAttribute("draggable", "true");
      ensureTeamDragId(card);
    });
  }

  // envelopa ensureMetaCard existente para sempre criar dropzone
  const _ensureMetaCard = NS.ensureMetaCard;
  NS.ensureMetaCard = function (metaId, title, options) {
    const card = typeof _ensureMetaCard === "function"
      ? _ensureMetaCard.call(NS, metaId, title, options)
      : document.querySelector(`#metaCardsContainer [data-meta-id="${metaId}"]`);
    ensureDropzone(card);
    if (card) {
      card.setAttribute("draggable", "true");
      ensureTeamDragId(card);
    }
    return card;                 // <<< retorna o CARD, não a dropzone
  };

  // observa novos cards adicionados à faixa
  const cont = el("metaCardsContainer");
  if (cont) {
    const mo = new MutationObserver((ms) => {
      for (const m of ms) {
        m.addedNodes.forEach((n) => {
          if (n.nodeType === 1) {
            if (n.matches?.("#metaCardsContainer [data-meta-id]")) {
              ensureDropzone(n);
              n.setAttribute("draggable", "true");
              ensureTeamDragId(n);
            }
            n.querySelectorAll?.("#metaCardsContainer [data-meta-id]").forEach((card) => {
              ensureDropzone(card);
              card.setAttribute("draggable", "true");
              ensureTeamDragId(card);
            });
          }
        });
      }
    });
    mo.observe(cont, { childList: true, subtree: true });
  }

  // ---------- fallback addToMeta (usa o seu se existir) ----------
  function fallbackAddToMeta(sid, metaId, target) {
    const name = findServerNameById(sid);
    let dz = null;
    if (target) {
      if (target.classList?.contains("meta-dropzone")) {
        dz = target;
      } else {
        dz = ensureDropzone(target);
      }
    }
    if (!dz) {
      const card = document.querySelector(`#metaCardsContainer [data-meta-id="${metaId}"]`) || NS.ensureMetaCard(metaId, "");
      dz = ensureDropzone(card);
    }
    if (!dz) return;

    const exists = dz.querySelector(`.servidor-chip[data-id="${sid}"]`);
    if (exists) { exists.classList.add("dup-anim"); setTimeout(() => exists.classList.remove("dup-anim"), 450); return; }

    const chip = document.createElement("div");
    chip.className = "servidor-chip"; chip.dataset.id = sid;
    chip.innerHTML = `
      <span class="chip-icon"><i class="bi bi-person-fill"></i></span>
      <span class="chip-name">${escapeHtml(name)}</span>
      <button type="button" class="chip-remove" title="Remover">&times;</button>
    `;
    chip.querySelector(".chip-remove").addEventListener("click", () => {
      chip.remove();
      allocations[sid] = Math.max(0, (allocations[sid] || 0) - 1);
      if ((allocations[sid] || 0) === 0) appendToAvailableIfMissing(sid, name);
      updateCounts();
      try { NS.refreshExpedienteFromLivres?.(); } catch (_) {}
    });

    dz.appendChild(chip);
    const prev = allocations[sid] || 0;
    allocations[sid] = prev + 1;
    if (prev === 0) removeFromExpediente(sid);
    updateCounts();
  }

  function addToMeta(sid, metaId, target) {
    if (typeof NS.addToMeta === "function" && NS.addToMeta !== addToMeta) {
      if (NS.addToMeta.length >= 3) return NS.addToMeta(sid, metaId, target);
      if (!target) return NS.addToMeta(sid, metaId); // usa a sua, se existir
    }
    return fallbackAddToMeta(sid, metaId, target);
  }
  function copyTeamToDropzone(sourceCard, targetDz) {
    if (!sourceCard || !targetDz) return;
    const targetCard = targetDz.closest("#metaCardsContainer [data-meta-id]");
    if (!targetCard || targetCard === sourceCard) return;
    const metaId = targetCard.dataset.metaId;
    if (!metaId) return;
    getServerIdsFromCard(sourceCard).forEach((sid) => addToMeta(sid, metaId, targetDz));
    updateCounts();
  }

  function getDropzoneFromEvent(e) {
    const path = (e.composedPath && e.composedPath()) || [];
    let dz = null;
    for (const n of path) {
      if (n && n.classList?.contains("meta-dropzone")) { dz = n; break; }
      if (n && n.dataset?.metaId && n.closest?.("#metaCardsContainer")) {
        dz = n.querySelector?.(".meta-dropzone") || ensureDropzone(n);
        if (dz) break;
      }
    }
    if (!dz) {
      const direct = e.target?.closest?.(".meta-dropzone");
      if (direct && direct.closest?.("#metaCardsContainer")) dz = direct;
    }
    if (!dz) {
      const card = e.target?.closest?.("#metaCardsContainer [data-meta-id]");
      if (card) dz = card.querySelector(".meta-dropzone") || ensureDropzone(card);
    }
    if (!dz && typeof e.clientX === "number") {
      const elAtPoint = document.elementFromPoint(e.clientX, e.clientY);
      const card = elAtPoint?.closest?.("#metaCardsContainer [data-meta-id]");
      if (card) dz = card.querySelector(".meta-dropzone") || ensureDropzone(card);
    }
    return dz;
  }

  // ---------- DnD (delegação) ----------
  function setDraggableOnCards(root = document) {
    root.querySelectorAll('.servidor-card[data-id]').forEach(el => {
      if (!el.hasAttribute('draggable')) el.setAttribute('draggable', 'true');
    });
  }
  setDraggableOnCards();
  const moPool = new MutationObserver(ms => ms.forEach(m =>
    m.addedNodes.forEach(n => n.nodeType === 1 && setDraggableOnCards(n))
  ));
  moPool.observe(document.documentElement, { childList: true, subtree: true });

  document.addEventListener("dragstart", (e) => {
    const card = e.target.closest(".servidor-card[data-id]");
    if (!card) return;
    const sid = card.dataset.id;
    DRAG.id = sid;
    if (e.dataTransfer) {
      e.dataTransfer.setData("text/plain", sid);
      e.dataTransfer.setData("application/x-sid", sid);
      e.dataTransfer.effectAllowed = "move";
    }
  }, true);

  document.addEventListener("dragstart", (e) => {
    if (e.target.closest("button,a,input,select,textarea,.servidor-chip,.meta-dropzone")) return;
    const card = e.target.closest("#metaCardsContainer [data-meta-id]");
    if (!card) return;
    const ids = getServerIdsFromCard(card);
    if (!ids.length) {
      e.preventDefault();
      return;
    }
    const dragId = ensureTeamDragId(card);
    DRAG.teamCardId = dragId;
    if (e.dataTransfer) {
      e.dataTransfer.setData(TEAM_DRAG_KEY, dragId);
      e.dataTransfer.setData("text/plain", `team:${dragId}`);
      e.dataTransfer.effectAllowed = "copy";
    }
    card.classList.add("is-team-dragging");
  }, true);

  document.addEventListener("dragend", () => {
    DRAG.id = null;
    DRAG.teamCardId = null;
    document.querySelectorAll(".is-team-dragging").forEach((card) => card.classList.remove("is-team-dragging"));
  }, true);

  document.addEventListener("dragover", (e) => {
    const dz = getDropzoneFromEvent(e);
    if (!dz) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = DRAG.teamCardId ? "copy" : "move";
    dz.classList.add("drop-hover");
  }, true);

  document.addEventListener("dragleave", (e) => {
    const dz = getDropzoneFromEvent(e);
    if (dz) dz.classList.remove("drop-hover");
  }, true);

  document.addEventListener("drop", (e) => {
    const dz = getDropzoneFromEvent(e);
    if (!dz) return;
    e.preventDefault();
    dz.classList.remove("drop-hover");

    const metaId = dz.closest("[data-meta-id]")?.dataset.metaId;
    const teamDragId = (e.dataTransfer && e.dataTransfer.getData(TEAM_DRAG_KEY)) || DRAG.teamCardId || "";
    if (teamDragId) {
      const sourceCard = document.querySelector(`#metaCardsContainer [data-team-drag-id="${teamDragId}"]`);
      copyTeamToDropzone(sourceCard, dz);
      return;
    }

    let sid = (e.dataTransfer && (e.dataTransfer.getData("application/x-sid") || e.dataTransfer.getData("text/plain"))) || DRAG.id;
    if (!metaId || !sid) return;

    addToMeta(sid, metaId, dz);
  }, true);

  // habilita drop no expediente (opcional)
  const expBody = el("expedienteBody");
  if (expBody) {
    expBody.addEventListener("dragover", (e) => { e.preventDefault(); }, true);
    expBody.addEventListener("drop", (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (e.stopImmediatePropagation) e.stopImmediatePropagation();
      if (e.dataTransfer && e.dataTransfer.getData(TEAM_DRAG_KEY)) return;
      const incluirExp = document.getElementById("programar-incluirExpediente");
      if (incluirExp && !incluirExp.checked) return;
      const sid = (e.dataTransfer && (e.dataTransfer.getData("application/x-sid") || e.dataTransfer.getData("text/plain"))) || DRAG.id;
      if (!sid) return;
      const name = findServerNameById(sid);
      appendToExpedienteIfMissing(sid, name);
      updateCounts();
    }, true);
  }

  // 🔴 AQUI ESTAVA O PROBLEMA: ouça a abertura da modal certa
  // Escuta qualquer modal do Bootstrap e filtra pelo ID do seu modal
  document.addEventListener("shown.bs.modal", (e) => {
    const tgt = e.target;
    if (!tgt) return;
    if (tgt.id === "programar-modalAtividade" || tgt.id === "programarModal") {
      upgradeExistingCards();
      updateCounts();
    }
  });

  // fallback inicial
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => { upgradeExistingCards(); updateCounts(); });
  } else {
    upgradeExistingCards(); updateCounts();
  }
})();
</script>
