<script>
(function () {
  const NS = (window.PROGRAMAR = window.PROGRAMAR || {});
  if (NS._atividadesLogicLoaded) return;
  NS._atividadesLogicLoaded = true;

  const allocations = (NS._allocations = NS._allocations || Object.create(null));
  const el = (id) => document.getElementById(id);
  const metaCardsContainer = () => el("metaCardsContainer");
  function shouldAutoScroll(){
    try { return Boolean(window.PROGRAMAR?.autoScrollModal); } catch(_) { return false; }
  }
  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function updateCounts() { NS.updateCounts?.(); }

  function isCardConcluded(card) {
    if (!card) return false;
    const raw = String(card.dataset.concluido || "").toLowerCase();
    return raw === "true" || raw === "1";
  }

  function getCardExecStatus(card) {
    if (!card) return "pendente";
    const raw = String(card.dataset.statusExecucao || "").trim().toLowerCase();
    if (
      raw === "remarcada_concluida" ||
      raw === "remarcada-concluida" ||
      raw === "remarcada e concluida"
    ) return "remarcada_concluida";
    if (
      raw === "encerrada_automaticamente" ||
      raw === "encerrada-automaticamente" ||
      raw === "encerrada automaticamente"
    ) return "encerrada_automaticamente";
    if (raw === "executada" || raw === "concluida") return "executada";
    if (raw === "cancelada" || raw === "cancelado") return "cancelada";
    if (
      raw === "nao_realizada_justificada" ||
      raw === "nao-realizada-justificada" ||
      raw === "nao realizada justificada"
    ) return "nao_realizada_justificada";
    if (raw === "nao_realizada" || raw === "nao-realizada" || raw === "nao realizada") return "nao_realizada";
    if (raw === "pendente") return "pendente";
    return isCardConcluded(card) ? "executada" : "pendente";
  }

  function applyConclusionStyles(link, status) {
    if (!link) return;
    const execStatus = String(status || "").trim().toLowerCase();
    link.classList.remove(
      "btn-success",
      "btn-outline-success",
      "btn-outline-secondary",
      "btn-secondary",
      "btn-info",
      "btn-primary",
      "btn-dark",
      "is-not-executed",
      "is-justified",
      "is-rescheduled",
      "is-cancelled",
      "is-auto-closed"
    );
    if (execStatus === "remarcada_concluida") {
      link.classList.add("btn-primary", "is-rescheduled");
    } else if (execStatus === "encerrada_automaticamente") {
      link.classList.add("btn-secondary", "is-auto-closed");
    } else if (execStatus === "executada") {
      link.classList.add("btn-success");
    } else if (execStatus === "cancelada") {
      link.classList.add("btn-dark", "is-cancelled");
    } else if (execStatus === "nao_realizada_justificada") {
      link.classList.add("btn-info", "is-justified");
    } else if (execStatus === "nao_realizada") {
      link.classList.add("btn-outline-secondary", "is-not-executed");
    } else {
      link.classList.add("btn-outline-success");
    }
    const icon = link.querySelector("i");
    if (icon) {
      icon.classList.toggle("bi-check2-square", execStatus === "pendente");
      icon.classList.toggle("bi-arrow-repeat", execStatus === "remarcada_concluida");
      icon.classList.toggle("bi-flag-fill", execStatus === "encerrada_automaticamente");
      icon.classList.toggle("bi-check-circle", execStatus === "executada");
      icon.classList.toggle("bi-ban", execStatus === "cancelada");
      icon.classList.toggle("bi-x-circle", execStatus === "nao_realizada");
      icon.classList.toggle("bi-shield-check", execStatus === "nao_realizada_justificada");
    }
    let label = execStatus === "remarcada_concluida"
      ? "Atividade remarcada e concluida em Minhas Metas"
      : (execStatus === "executada"
      ? "Atividade concluida em Minhas Metas"
      : (execStatus === "cancelada"
        ? "Atividade cancelada em Minhas Metas"
      : (execStatus === "nao_realizada_justificada"
        ? "Atividade nao realizada justificada em Minhas Metas"
      : (execStatus === "nao_realizada"
        ? "Atividade não realizada, mas continua em aberto em Minhas Metas"
        : "Concluir item em Minhas Metas"))));
    if (execStatus === "encerrada_automaticamente") {
      label = "Atividade encerrada automaticamente ao encerrar a meta";
    }
    link.title = label;
    link.setAttribute("aria-label", label);
  }

function syncConclusionLink(card) {
    if (!card) return;
    const link = card.querySelector(".meta-concluir");
    if (!link) return;
    const base = link.dataset.urlBase || window.PROGRAMAR?.urls?.concluirItemBase || "";
    const itemId = card.dataset.itemId;
    if (itemId && base) {
      let href = base;
      if (href.includes("/0/")) {
        href = href.replace(/\/0(\/concluir\/?)/, `/${itemId}$1`);
      } else if (href.includes("__ID__")) {
        href = href.replace(/__ID__/g, String(itemId));
      } else if (!/\d+/.test(href.slice(-1))) {
        href = href.replace(/$/, `/${itemId}`);
      }
      const selectedDate = String(document.getElementById("programar-dataAtividade")?.value || "").trim();
      const programarBase = window.PROGRAMAR?.urls?.calendario || "/programar/";
      let next = "/minhas-metas/";
      if (/^\d{4}-\d{2}-\d{2}$/.test(selectedDate)) {
        try {
          const nextUrl = new URL(programarBase, window.location.origin);
          nextUrl.searchParams.set("selected_date", selectedDate);
          nextUrl.searchParams.set("open_modal", "1");
          next = `${nextUrl.pathname}${nextUrl.search}`;
        } catch (_err) {}
      }
      try {
        const targetUrl = new URL(href, window.location.origin);
        targetUrl.searchParams.set("source", "minhas-metas");
        targetUrl.searchParams.set("next", next);
        link.href = `${targetUrl.pathname}${targetUrl.search}`;
      } catch (_err) {
        const nextEncoded = encodeURIComponent(next);
        link.href = `${href}?source=minhas-metas&next=${nextEncoded}`;
      }
      link.classList.remove("d-none");
      link.setAttribute("aria-disabled", "false");
    } else {
      link.href = "#";
      link.classList.add("d-none");
      link.setAttribute("aria-disabled", "true");
    }
    applyConclusionStyles(link, getCardExecStatus(card));
  }
  NS.syncMetaConclusionLink = syncConclusionLink;
  function tryAddVeiculosOptions(select) {
    if (!select || select.dataset.veiculosPopulado === "1") return;
    const data = Array.isArray(window.PROGRAMAR?.veiculosAtivos) ? window.PROGRAMAR.veiculosAtivos : [];
    if (!data.length) return;
    data.forEach((v) => {
      if (!v || v.id == null) return;
      const value = String(v.id);
      if (select.querySelector(`option[value="${value}"]`)) return;
      const opt = document.createElement("option");
      opt.value = value;
      const nome = (v.nome || "").trim();
      const placa = (v.placa || "").trim();
      opt.textContent = placa ? `${nome} - ${placa}` : (nome || placa || `Veículo #${value}`);
      select.appendChild(opt);
    });
    select.dataset.veiculosPopulado = "1";
  }

  const OBS_IDS = {
    modal: "programar-modalObservacao",
    input: "programar-obs-text",
    save: "programar-obs-save",
    clear: "programar-obs-clear",
    cancel: "programar-obs-cancel",
    meta: "programar-obs-meta",
  };

  function getObsValue(card) {
    return (card?.querySelector('textarea[name="observacao"]')?.value || "").trim();
  }

  function syncObsIndicator(card) {
    if (!card) return;
    const btn = card.querySelector(".meta-obs-btn");
    const ta = card.querySelector('textarea[name="observacao"]');
    if (!btn || !ta) return;
    const hasObs = !!ta.value.trim();
    btn.classList.toggle("has-obs", hasObs);
    btn.title = hasObs ? "Editar observacao" : "Adicionar observacao";
    btn.setAttribute("aria-pressed", hasObs ? "true" : "false");
  }
  NS.syncObsIndicator = syncObsIndicator;

  function applyObsToCard(card, text) {
    if (!card) return;
    const ta = card.querySelector('textarea[name="observacao"]');
    if (ta) ta.value = text || "";
    NS._obsDirty = true;
    syncObsIndicator(card);
  }

  function openCancelamentoItem(card) {
    const itemId = String(card?.dataset?.itemId || "").trim();
    if (!itemId) return false;
    const title = (card.querySelector(".meta-title-text")?.textContent || "atividade").trim();
    const msg = `Como a atividade "${title}" já foi salva no banco, não é possível remover. Você pode usar a opção Cancelar na tela de conclusão/cancelamento para eliminar ela da programação. Deseja abrir essa tela agora?`;
    if (!window.confirm(msg)) return true;
    try { syncConclusionLink(card); } catch (_) {}
    const href = card.querySelector(".meta-concluir")?.href || "";
    if (!href || href.endsWith("#")) {
        window.alert("Não foi possível abrir a tela de cancelamento deste item.");
      return true;
    }
    try {
      const url = new URL(href, window.location.origin);
      url.searchParams.set("status", "cancelada");
      window.location.href = `${url.pathname}${url.search}`;
    } catch (_) {
      window.location.href = `${href}${href.includes("?") ? "&" : "?"}status=cancelada`;
    }
    return true;
  }

  function openObsModal(card) {
    if (!card) return;
    const modalEl = document.getElementById(OBS_IDS.modal);
    if (!modalEl) return;
    NS._obsCard = card;
    const input = document.getElementById(OBS_IDS.input);
    if (input) input.value = getObsValue(card);
    const metaLabel = document.getElementById(OBS_IDS.meta);
    if (metaLabel) {
      metaLabel.textContent = (card.querySelector(".meta-title-text")?.textContent || "Atividade").trim();
    }
    if (window.bootstrap) bootstrap.Modal.getOrCreateInstance(modalEl).show();
    if (input) setTimeout(() => input.focus(), 50);
  }

  const GRAFICO_IDS = {
    modal: "programar-modalGraficoAtividade",
    title: "programar-modalGraficoAtividadeLabel",
    nome: "programar-graficoAtividadeNome",
    mes: "programar-graficoAtividadeMes",
    total: "programar-graficoAtividadeTotal",
    empty: "programar-graficoAtividadeEmpty",
    canvas: "programar-graficoAtividadeCanvas",
    geralEmpty: "programar-graficoAlocacoesGeralEmpty",
    geralCanvas: "programar-graficoAlocacoesGeralCanvas",
    veiculosEmpty: "programar-graficoVeiculosEmpty",
    veiculosCanvas: "programar-graficoVeiculosCanvas",
  };
  let graficoAtividadeChart = null;
  let graficoAlocacoesGeralChart = null;
  let graficoVeiculosChart = null;

  function currentModalMonth() {
    const selectedDate = String(document.getElementById("programar-dataAtividade")?.value || "").trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(selectedDate)) {
      return selectedDate.slice(0, 7);
    }
    const calendarDate = NS?.calendar?.view?.currentStart;
    const d = calendarDate instanceof Date ? calendarDate : new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
  }

  function setGraficoLoading(loading) {
    const empties = [
      document.getElementById(GRAFICO_IDS.empty),
      document.getElementById(GRAFICO_IDS.geralEmpty),
      document.getElementById(GRAFICO_IDS.veiculosEmpty),
    ].filter(Boolean);
    if (loading) {
      empties.forEach((empty) => {
        empty.textContent = "Carregando alocações...";
        empty.classList.remove("d-none");
      });
    }
  }

  function renderBarChart({ canvasId, emptyId, payload, chartRef, onChart, fullBarLabel = false }) {
    const canvas = document.getElementById(canvasId);
    const empty = document.getElementById(emptyId);
    if (!canvas || !payload) return;

    const labels = payload.labels || [];
    const datasets = payload.datasets || [];
    const displayLabels = labels.map((label) => {
      const text = String(label || "").trim();
      if (fullBarLabel) return text;
      return text.split(/\s+/)[0] || text;
    });
    const wrap = canvas.parentElement;
    const hasData = labels.length > 0 && datasets.some((ds) => (ds.data || []).some((value) => Number(value || 0) > 0));
    if (empty) {
      empty.textContent = hasData ? "" : "Nenhuma alocação encontrada para este mês.";
      empty.classList.toggle("d-none", hasData);
    }
    if (wrap) {
      wrap.classList.toggle("d-none", !hasData);
      canvas.height = 340;
    }

    if (!hasData) {
      if (chartRef) {
        chartRef.destroy();
      }
      onChart(null);
      return;
    }

    const config = {
      type: "bar",
      data: { labels: displayLabels, datasets },
      plugins: [
        {
          id: `programarBarNames-${canvasId}`,
          afterDatasetsDraw(chart) {
            const { ctx, chartArea } = chart;
            ctx.save();
            ctx.font = "600 10px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            chart.data.datasets.forEach((dataset, datasetIndex) => {
              const meta = chart.getDatasetMeta(datasetIndex);
              if (!meta || meta.hidden) return;
              meta.data.forEach((bar, index) => {
                const value = Number(dataset.data[index] || 0);
                if (!value) return;
                const label = displayLabels[index] || "";
                if (!label) return;
                const barHeight = chartArea.bottom - bar.y;
                const inside = barHeight >= 54;
                ctx.save();
                ctx.translate(bar.x, inside ? chartArea.bottom - 8 : bar.y - 12);
                ctx.rotate(inside ? -Math.PI / 2 : 0);
                ctx.textAlign = inside ? "left" : "center";
                ctx.fillStyle = inside ? "#ffffff" : "#495057";
                ctx.fillText(label, 0, 0);
                ctx.restore();
              });
            });
            ctx.restore();
          },
        },
      ],
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label(context) {
                const value = context.parsed?.y ?? context.parsed ?? 0;
                return `Alocações: ${value}`;
              },
              title(items) {
                if (!items || !items.length) return "";
                const idx = items[0].dataIndex;
                return labels[idx] || "";
              },
              footer(items) {
                if (!items || !items.length) return "";
                const idx = items[0].dataIndex;
                return (payload.hints || [])[idx] || "";
              },
            },
          },
        },
        scales: {
          x: {
            ticks: {
              display: false,
            },
            grid: { display: false },
          },
          y: {
            beginAtZero: true,
            ticks: { precision: 0 },
            grid: { color: "rgba(108, 117, 125, 0.18)" },
          },
        },
      },
    };

    if (chartRef) {
      chartRef.data = config.data;
      chartRef.options = config.options;
      chartRef.update();
    } else if (typeof Chart !== "undefined") {
      onChart(new Chart(canvas, config));
    } else if (empty) {
      empty.textContent = "Chart.js não encontrado.";
      empty.classList.remove("d-none");
      wrap?.classList.add("d-none");
    }
  }

  function renderGraficoAtividade(payload) {
    const totalEl = document.getElementById(GRAFICO_IDS.total);
    const nomeEl = document.getElementById(GRAFICO_IDS.nome);
    const titleEl = document.getElementById(GRAFICO_IDS.title);
    const total = Number(payload?.total || 0);
    if (totalEl) totalEl.textContent = total.toLocaleString("pt-BR");
    if (nomeEl) nomeEl.textContent = payload?.atividade || NS._graficoAtividadeTitulo || "-";
    if (titleEl) titleEl.textContent = "Alocações por servidor";

    renderBarChart({
      canvasId: GRAFICO_IDS.canvas,
      emptyId: GRAFICO_IDS.empty,
      payload,
      chartRef: graficoAtividadeChart,
      onChart(chart) { graficoAtividadeChart = chart; },
    });
    renderBarChart({
      canvasId: GRAFICO_IDS.geralCanvas,
      emptyId: GRAFICO_IDS.geralEmpty,
      payload: payload?.alocacoes_gerais,
      chartRef: graficoAlocacoesGeralChart,
      onChart(chart) { graficoAlocacoesGeralChart = chart; },
    });
    renderBarChart({
      canvasId: GRAFICO_IDS.veiculosCanvas,
      emptyId: GRAFICO_IDS.veiculosEmpty,
      payload: payload?.veiculos,
      chartRef: graficoVeiculosChart,
      onChart(chart) { graficoVeiculosChart = chart; },
      fullBarLabel: true,
    });
  }

  async function carregarGraficoAtividade() {
    const metaId = String(NS._graficoAtividadeMetaId || "").trim();
    const mes = String(document.getElementById(GRAFICO_IDS.mes)?.value || currentModalMonth()).trim();
    const urlBase = NS?.urls?.alocacoesServidoresAtividade;
    if (!metaId || !urlBase) return;
    setGraficoLoading(true);
    try {
      const url = new URL(urlBase, window.location.origin);
      url.searchParams.set("meta_id", metaId);
      url.searchParams.set("mes", mes);
      const resp = await fetch(url.toString(), {
        credentials: "same-origin",
        headers: { "X-Requested-With": "XMLHttpRequest" },
      });
      const json = await resp.json();
      if (!resp.ok || json.ok === false) {
        throw new Error(json.error || `HTTP ${resp.status}`);
      }
      renderGraficoAtividade(json);
    } catch (err) {
      const empties = [
        document.getElementById(GRAFICO_IDS.empty),
        document.getElementById(GRAFICO_IDS.geralEmpty),
        document.getElementById(GRAFICO_IDS.veiculosEmpty),
      ].filter(Boolean);
      empties.forEach((empty) => {
        empty.textContent = err.message || "Erro ao carregar alocações.";
        empty.classList.remove("d-none");
      });
      document.getElementById(GRAFICO_IDS.canvas)?.parentElement?.classList.add("d-none");
      document.getElementById(GRAFICO_IDS.geralCanvas)?.parentElement?.classList.add("d-none");
      document.getElementById(GRAFICO_IDS.veiculosCanvas)?.parentElement?.classList.add("d-none");
      console.error("[programar] grafico atividade:", err);
    }
  }

  function openGraficoAtividade(card) {
    if (!card) return;
    const metaId = String(card.dataset.metaId || "").trim();
    if (!metaId) return;
    NS._graficoAtividadeMetaId = metaId;
    NS._graficoAtividadeTitulo = (card.querySelector(".meta-title-text")?.textContent || "Atividade").trim();

    const modalEl = document.getElementById(GRAFICO_IDS.modal);
    if (!modalEl) return;
    const nomeEl = document.getElementById(GRAFICO_IDS.nome);
    const totalEl = document.getElementById(GRAFICO_IDS.total);
    const mesEl = document.getElementById(GRAFICO_IDS.mes);
    if (nomeEl) nomeEl.textContent = NS._graficoAtividadeTitulo;
    if (totalEl) totalEl.textContent = "0";
    if (mesEl) mesEl.value = currentModalMonth();
    setGraficoLoading(true);
    if (window.bootstrap) bootstrap.Modal.getOrCreateInstance(modalEl).show();
    carregarGraficoAtividade();
  }

  NS.ensureMetaCard = function (metaId, metaTitle, options = {}) {
    const cont = metaCardsContainer();
    if (!cont) return null;

    const forceNew = Boolean(options && options.forceNew);
    const metaDescription = String(options?.metaDescricao || "").trim();
    const remarcadoDeId = String(options?.remarcadoDeId || "").trim();
    const safeMetaTitle = escapeHtml(metaTitle || "");
    const safeMetaDescription = escapeHtml(metaDescription);

    if (!forceNew) {
      let existing = null;
      if (remarcadoDeId) {
        existing = cont.querySelector(`[data-meta-id="${metaId}"][data-remarcado-de-id="${remarcadoDeId}"]`);
      }
      if (!existing) {
        existing = cont.querySelector(`[data-meta-id="${metaId}"]`);
      }
      if (existing) {
        const descEl = existing.querySelector(".meta-description");
        if (descEl && metaDescription) {
          descEl.textContent = metaDescription;
          descEl.classList.remove("d-none");
        }
        if (remarcadoDeId) {
          existing.dataset.remarcadoDeId = remarcadoDeId;
        }
        tryAddVeiculosOptions(existing.querySelector("select.card-veiculos"));
        syncObsIndicator(existing);
        if (shouldAutoScroll()) {
          existing.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "start" });
        }
        return existing;
    }
  }

    const card = document.createElement("div");
    card.className = "card shadow-sm servidor-cardbox";
    card.dataset.metaId = metaId;
    if (remarcadoDeId) {
      card.dataset.remarcadoDeId = remarcadoDeId;
    }
    card.style.minWidth = "340px";
    card.style.maxWidth = "370px";

    card.innerHTML = `
      <div class="card-header bg-light border-bottom py-2">
        <div class="d-flex align-items-center justify-content-between">
          <b class="meta-title-text">${safeMetaTitle}</b>
          <div class="d-flex align-items-center gap-2 meta-actions">
            <span class="badge bg-primary count-meta">0</span>
            <a class="btn btn-outline-success btn-sm py-0 px-1 meta-concluir d-none"
               href="#"
               data-url-base="{% url 'programar:concluir-item-form' 0 %}"
               title="Concluir item em Minhas Metas"
               aria-label="Concluir item em Minhas Metas">
              <i class="bi bi-check2-square"></i>
            </a>
            <button type="button"
                    class="btn btn-outline-info btn-sm py-0 px-1 meta-grafico"
                    title="Ver gráfico da atividade"
                    aria-label="Ver gráfico da atividade">
              <i class="bi bi-bar-chart-line"></i>
            </button>
            <button type="button" class="btn-close meta-close" aria-label="Remover" title="Remover card"></button>

          </div>
        </div>
      </div>
      <div class="card-body meta-body">
        <p class="meta-description small text-muted mb-2${metaDescription ? "" : " d-none"}">${safeMetaDescription}</p>
        <!-- área de alocação dos servidores -->
        <div class="servidores-grid meta-dropzone dropzone mb-3"></div>
        <div class="mb-2 meta-vehicles-block">
          <label class="form-label mb-1">Veículo</label>
          <select class="form-select form-select-sm card-veiculos" name="card_veiculos" data-placeholder="Nenhum veículo" data-meta-id="${metaId}">
            <option value="" data-placeholder="1">Nenhum veículo</option>
          </select>
        </div>
        <div class="meta-obs-actions">
          <button type="button" class="btn btn-outline-secondary btn-sm meta-obs-btn" title="Adicionar observacao" aria-label="Observacao">
            <i class="bi bi-chat-left-text"></i>
            <span class="meta-obs-dot" aria-hidden="true"></span>
          </button>
        </div>
        <textarea class="meta-obs-input d-none" name="observacao" rows="2"></textarea>
      </div>
    `;
    card.dataset.concluido = "false";
    card.dataset.statusExecucao = "pendente";

    cont.appendChild(card);
    tryAddVeiculosOptions(card.querySelector("select.card-veiculos"));
    syncObsIndicator(card);

    card.querySelectorAll(".alert").forEach((n) => n.remove());

    card.querySelector(".btn-close, .meta-close")?.addEventListener("click", (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      if (ev.stopImmediatePropagation) ev.stopImmediatePropagation();

      if (openCancelamentoItem(card)) {
        return;
      }

      const chipXs = Array.from(card.querySelectorAll(".servidor-chip .chip-remove"));
      chipXs.forEach((b) => { try { b.click(); } catch (_) {} });

      if (card.querySelector(".servidor-chip")) {
        try { window.ProgramarCards?.returnAllFromCard?.(card); } catch (_) {}
      }

      NS._obsDirty = true;
      try { card.remove(); } catch (_) {}
      setTimeout(() => { try { window.PROGRAMAR?.refreshExpedienteFromLivres?.(); } catch (_) {} }, 0);
      setTimeout(() => { try { window.PROGRAMAR?.refreshExpedienteFromLivres?.(); } catch (_) {} }, 120);
      try { (window.PROGRAMAR?.updateCounts || window.ProgramarCards?.updateCounts)?.(); } catch (_) {}
    }, { capture: true });

    if (shouldAutoScroll()) {
      card.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "start" });
    }
    syncConclusionLink(card);
    updateCounts();
    return card;
  };

  // --------- Observacao: delegacao ----------
  document.addEventListener("click", (ev) => {
    const btn = ev.target.closest?.(".meta-obs-btn");
    if (!btn) return;
    ev.preventDefault();
    const card = btn.closest("[data-meta-id]");
    openObsModal(card);
  });

  document.addEventListener("click", (ev) => {
    const btn = ev.target.closest?.(".meta-grafico");
    if (!btn) return;
    ev.preventDefault();
    const card = btn.closest("[data-meta-id]");
    openGraficoAtividade(card);
  });

  document.addEventListener("change", (ev) => {
    if (ev.target?.id !== GRAFICO_IDS.mes) return;
    carregarGraficoAtividade();
  });

  document.addEventListener("click", (ev) => {
    const saveBtn = ev.target.closest?.("#" + OBS_IDS.save);
    if (!saveBtn) return;
    ev.preventDefault();
    const card = NS._obsCard;
    const input = document.getElementById(OBS_IDS.input);
    const text = (input?.value || "").trim();
    applyObsToCard(card, text);
    const modalEl = document.getElementById(OBS_IDS.modal);
    if (modalEl && window.bootstrap) bootstrap.Modal.getOrCreateInstance(modalEl).hide();
  });

  document.addEventListener("click", (ev) => {
    const clearBtn = ev.target.closest?.("#" + OBS_IDS.clear);
    if (!clearBtn) return;
    ev.preventDefault();
    const card = NS._obsCard;
    applyObsToCard(card, "");
    const input = document.getElementById(OBS_IDS.input);
    if (input) input.value = "";
    const modalEl = document.getElementById(OBS_IDS.modal);
    if (modalEl && window.bootstrap) bootstrap.Modal.getOrCreateInstance(modalEl).hide();
  });

  document.addEventListener("click", (ev) => {
    const cancelBtn = ev.target.closest?.("#" + OBS_IDS.cancel);
    if (!cancelBtn) return;
    NS._obsCancel = true;
  });

  document.addEventListener("show.bs.modal", (ev) => {
    if (ev.target?.id === OBS_IDS.modal) {
      NS._obsCancel = false;
    }
  });

  document.addEventListener("hide.bs.modal", (ev) => {
    if (ev.target?.id !== OBS_IDS.modal) return;
    if (NS._obsCancel) {
      NS._obsCancel = false;
      return;
    }
    const card = NS._obsCard;
    const input = document.getElementById(OBS_IDS.input);
    const text = (input?.value || "").trim();
    applyObsToCard(card, text);
  });
})();
</script>
